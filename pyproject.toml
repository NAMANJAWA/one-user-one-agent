[project]
name = "oua"
version = "1.0.0"
description = "One User, One Agent: a per-viewer lifecycle agent with a decide, act and measure loop"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic"]
test = ["pytest"]

[project.scripts]
oua = "oua.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
