name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The evidence pack is personal data and is not in the repo, so the end-to-end test skips here;
      # every other test builds its own tiny synthetic pack.
      - run: python -m unittest discover -s tests -v
